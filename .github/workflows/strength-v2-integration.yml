name: Strength V2 integration verifier

on:
  push:
    branches:
      - integration/strength-v2-bloom

permissions:
  contents: write

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch staged Strength source
        run: |
          git fetch origin feat/strength-v2-final feature/strength-engine-v2-final

      - name: Reconstruct staged Strength source
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/strength-source.bin
          for n in 00 01 02 03 04 05 06 07 08 09 10; do
            git show "origin/feat/strength-v2-final:.strength-v2-source/part${n}" | base64 -d >> /tmp/strength-source.bin
          done
          echo '=== SOURCE PAYLOAD ==='
          file /tmp/strength-source.bin
          if gzip -t /tmp/strength-source.bin 2>/dev/null; then
            echo 'SOURCE_GZIP_OK=1'
            tar -tzf /tmp/strength-source.bin | sed -n '1,360p'
          else
            echo 'SOURCE_GZIP_OK=0'
            head -c 200 /tmp/strength-source.bin | xxd
          fi

      - name: Reconstruct large patch payload
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/new-bloom-patch.bin
          for n in 00 01 02 03 04 05 06 07 08 09 10 11; do
            git show "origin/feat/strength-v2-final:.new-bloom-patch/part-${n}" | base64 -d >> /tmp/new-bloom-patch.bin
          done
          echo '=== LARGE PATCH ==='
          file /tmp/new-bloom-patch.bin
          if xz -t /tmp/new-bloom-patch.bin 2>/dev/null; then
            echo 'PATCH_XZ_OK=1'
            xz -dc /tmp/new-bloom-patch.bin > /tmp/new-bloom-patch.dec
            file /tmp/new-bloom-patch.dec
            if tar -tf /tmp/new-bloom-patch.dec >/tmp/patch-list.txt 2>/dev/null; then
              echo 'PATCH_IS_TAR=1'
              sed -n '1,420p' /tmp/patch-list.txt
            elif grep -q '^diff --git ' /tmp/new-bloom-patch.dec; then
              echo 'PATCH_IS_GIT_DIFF=1'
              grep '^diff --git ' /tmp/new-bloom-patch.dec | sed -n '1,360p'
            else
              echo 'Decoded payload type:'
              file /tmp/new-bloom-patch.dec
              head -c 1200 /tmp/new-bloom-patch.dec || true
            fi
          else
            echo 'PATCH_XZ_OK=0'
            head -c 300 /tmp/new-bloom-patch.bin | xxd
          fi
