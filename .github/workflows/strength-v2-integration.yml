name: Strength V2 integration verifier

on:
  push:
    branches:
      - integration/strength-v2-bloom

permissions:
  contents: write

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch staged Strength source
        run: |
          git fetch origin feat/strength-v2-final feature/strength-engine-v2-final

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/strength-source.b64
          for n in 00 01 02 03 04 05 06 07 08; do
            git show "origin/feat/strength-v2-final:.strength-v2-source/part${n}" >> /tmp/strength-source.b64
          done
          base64 -d /tmp/strength-source.b64 > /tmp/strength-source.tar.gz
          echo '=== SOURCE ARCHIVE ==='
          file /tmp/strength-source.tar.gz
          tar -tzf /tmp/strength-source.tar.gz | sed -n '1,220p'

      - name: Reconstruct large patch archive
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/new-bloom-patch.b64
          for n in 00 01 02 03 04 05 06 07 08 09 10 11; do
            git show "origin/feat/strength-v2-final:.new-bloom-patch/part-${n}" >> /tmp/new-bloom-patch.b64
          done
          base64 -d /tmp/new-bloom-patch.b64 > /tmp/new-bloom-patch.bin
          echo '=== LARGE PATCH ==='
          file /tmp/new-bloom-patch.bin
          if xz -t /tmp/new-bloom-patch.bin 2>/dev/null; then
            xz -dc /tmp/new-bloom-patch.bin > /tmp/new-bloom-patch.dec
            file /tmp/new-bloom-patch.dec
            if tar -tf /tmp/new-bloom-patch.dec >/tmp/patch-list.txt 2>/dev/null; then
              sed -n '1,320p' /tmp/patch-list.txt
            else
              echo 'Decoded xz payload is not a tar archive.'
              head -c 300 /tmp/new-bloom-patch.dec | xxd
            fi
          else
            echo 'Payload is not xz; trying tar/gzip.'
            tar -tf /tmp/new-bloom-patch.bin | sed -n '1,320p'
          fi
