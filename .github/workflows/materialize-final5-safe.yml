name: Materialize Final5 Safely

on:
  push:
    branches:
      - tmp/materialize-bloom-final5

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout payload branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild Final5 patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import pathlib
          import re

          root = pathlib.Path('.new-bloom-patch')
          parts = sorted(root.glob('part-*'))
          raw = b''.join(re.sub(rb'\s+', b'', p.read_bytes()) for p in parts)
          clean = re.sub(rb'[^A-Za-z0-9+/=]', b'', raw)
          clean += b'=' * ((4 - len(clean) % 4) % 4)
          decoded = base64.b64decode(clean, validate=False)
          pathlib.Path('/tmp/new-bloom.patch.xz').write_bytes(decoded)
          print('parts:', len(parts), 'encoded:', len(raw), 'decoded:', len(decoded))
          print('sha256:', hashlib.sha256(decoded).hexdigest())
          PY
          xz -t /tmp/new-bloom.patch.xz

      - name: Validate and apply Final5 to cleaned Meg V2 base
        shell: bash
        run: |
          git checkout --detach 217485f6701366f3cd4307d202e6c635d69021fb
          xz -dc /tmp/new-bloom.patch.xz > /tmp/new-bloom.patch
          git apply --check /tmp/new-bloom.patch
          git apply --index /tmp/new-bloom.patch
          git config user.name "Bloom Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: materialize Bloom Final5 for clean extraction"

      - name: Publish isolated materialized branch
        shell: bash
        run: |
          git push --force origin HEAD:refs/heads/tmp/bloom-final5-materialized
