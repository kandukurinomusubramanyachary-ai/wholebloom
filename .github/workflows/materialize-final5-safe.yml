name: Materialize Final5 Safely

on:
  push:
    branches:
      - tmp/materialize-bloom-final5

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout payload branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify Final5 patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import pathlib
          import re

          root = pathlib.Path('.new-bloom-patch')
          parts = sorted(root.glob('part-*'))
          decoded_parts = []
          for p in parts:
              raw = re.sub(rb'\s+', b'', p.read_bytes())
              clean = re.sub(rb'[^A-Za-z0-9+/=]', b'', raw)
              clean += b'=' * ((4 - len(clean) % 4) % 4)
              piece = base64.b64decode(clean, validate=False)
              decoded_parts.append(piece)
              print(p.name, 'encoded=', len(raw), 'mod4=', len(raw) % 4, 'tail=', raw[-8:].decode('ascii', 'replace'), 'decoded=', len(piece))
          decoded = b''.join(decoded_parts)
          pathlib.Path('/tmp/new-bloom.patch.xz').write_bytes(decoded)
          print('parts:', len(parts), 'decoded_total:', len(decoded))
          print('sha256:', hashlib.sha256(decoded).hexdigest())
          PY
          echo "fcc53d1855caa2f0ca48c43ffc5616461c78632c116bf8bdf9e437ac7be942e7  /tmp/new-bloom.patch.xz" | sha256sum -c -

      - name: Apply Final5 to cleaned Meg V2 base
        shell: bash
        run: |
          git checkout --detach 217485f6701366f3cd4307d202e6c635d69021fb
          xz -dc /tmp/new-bloom.patch.xz | git apply --index -
          git config user.name "Bloom Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: materialize Bloom Final5 for clean extraction"

      - name: Publish isolated materialized branch
        shell: bash
        run: |
          git push --force origin HEAD:refs/heads/tmp/bloom-final5-materialized
