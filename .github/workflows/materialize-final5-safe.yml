name: Inspect Recoverable Final5

on:
  push:
    branches:
      - tmp/materialize-bloom-final5

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout payload branch
        uses: actions/checkout@v4

      - name: Rebuild Final5 archive
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, pathlib, re
          parts = sorted(pathlib.Path('.new-bloom-patch').glob('part-*'))
          raw = b''.join(re.sub(rb'\s+', b'', p.read_bytes()) for p in parts)
          clean = re.sub(rb'[^A-Za-z0-9+/=]', b'', raw)
          clean += b'=' * ((4 - len(clean) % 4) % 4)
          decoded = base64.b64decode(clean, validate=False)
          pathlib.Path('/tmp/final5.patch.xz').write_bytes(decoded)
          print('archive-bytes', len(decoded), 'sha256', hashlib.sha256(decoded).hexdigest())
          PY

      - name: Inspect recoverable patch stream
        shell: bash
        run: |
          set +e
          xz -dc /tmp/final5.patch.xz > /tmp/final5.partial.patch 2>/tmp/xz.err
          status=$?
          set -e
          echo "xz_status=$status"
          cat /tmp/xz.err || true
          echo "partial_bytes=$(wc -c < /tmp/final5.partial.patch)"
          echo "partial_lines=$(wc -l < /tmp/final5.partial.patch)"
          echo '--- recovered changed paths ---'
          grep '^diff --git ' /tmp/final5.partial.patch | sed -E 's#diff --git a/([^ ]+) b/.*#\1#' || true
          echo '--- patch tail ---'
          tail -n 35 /tmp/final5.partial.patch || true
