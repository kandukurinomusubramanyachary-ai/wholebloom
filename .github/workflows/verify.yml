name: Verify Bloom

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Temporary write access is used only to add the missing Meg V2 lockfile on a
# same-repository pull request. Once committed, this workflow returns to read-only.
permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Bloom dependencies
        run: npm ci

      - name: Detect existing Meg V2 lockfile
        id: meg_lock
        shell: bash
        run: |
          if [ -f meg-engine-v2/package-lock.json ]; then
            echo "existed=true" >> "$GITHUB_OUTPUT"
          else
            echo "existed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Meg V2 dependencies
        run: npm install --prefix meg-engine-v2 --no-audit --no-fund

      - name: Commit generated Meg V2 lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.meg_lock.outputs.existed == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meg-engine-v2/package-lock.json
          git commit -m "Add deterministic Meg V2 lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Run Bloom integration tests
        run: npm test

      - name: Run Meg V2 engine tests
        run: timeout 120s npm test --prefix meg-engine-v2 -- --test-reporter=spec

      - name: Typecheck
        run: npm run typecheck

      - name: Build web
        run: npm run build:web

      - name: Build production container
        run: docker build -t wholebloom:verify .
