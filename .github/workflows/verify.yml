name: Verify Bloom

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Bloom dependencies
        run: npm ci

      - name: Install Meg V2 dependencies
        run: npm install --prefix meg-engine-v2 --no-audit --no-fund

      - name: Run Bloom integration tests
        run: npm test

      - name: Run Meg V2 engine tests
        run: timeout 120s npm test --prefix meg-engine-v2 -- --test-reporter=spec

      - name: Typecheck
        run: npm run typecheck

      - name: Build web
        run: npm run build:web
